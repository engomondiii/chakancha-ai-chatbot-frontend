<svg
  width="64"
  height="64"
  viewBox="0 0 64 64"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  aria-label="Chakan Tree"
  role="img"
>
  <!-- Ground -->
  <ellipse cx="32" cy="56" rx="16" ry="4" fill="#6B5544" opacity="0.2"/>

  <!-- Trunk -->
  <rect x="28" y="38" width="8" height="18" rx="3" fill="#6B5544"/>

  <!-- Roots -->
  <path d="M30 54 C26 54 22 56 20 58" stroke="#6B5544" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M34 54 C38 54 42 56 44 58" stroke="#6B5544" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Main canopy - dark green base -->
  <circle cx="32" cy="26" r="20" fill="#2D5016"/>

  <!-- Mid canopy highlight -->
  <circle cx="28" cy="22" r="14" fill="#3A6B1E"/>

  <!-- Top canopy highlight -->
  <circle cx="32" cy="17" r="10" fill="#4A7C2C"/>

  <!-- Leaf details -->
  <path d="M32 8 C32 8 26 12 26 20 C26 28 32 32 32 32 C32 32 38 28 38 20 C38 12 32 8 32 8Z" fill="#5A9434" opacity="0.7"/>
  <line x1="32" y1="8" x2="32" y2="32" stroke="#2D5016" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <path d="M32 14 C30 16 28 19 28 22" stroke="#2D5016" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M32 14 C34 16 36 19 36 22" stroke="#2D5016" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Gold accent dots (referral value points) -->
  <circle cx="20" cy="28" r="2.5" fill="#D4A574"/>
  <circle cx="44" cy="28" r="2.5" fill="#D4A574"/>
  <circle cx="32" cy="10" r="2.5" fill="#D4A574"/>
</svg>
